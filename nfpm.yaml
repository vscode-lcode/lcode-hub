name: lcode-hub
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: "shynome <shynome@gmail.com>"
description: "localhost lcode hub"
license: MIT

contents:
  - src: ./lcode-hub
    dst: /usr/local/bin/lcode-hub
    file_info:
      mode: 0755
  - src: ./systemd/lcode-hub.service
    dst: /lib/systemd/system/lcode-hub.service
    type: config

scripts:
  postinstall: ./scripts/postinstall.sh
  postremove: ./scripts/postremove.sh
